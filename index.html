<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>رحلة النور - الإصدار العالمي الاحترافي</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --panel-bg: rgba(30, 41, 59, 0.85);
            --accent-color: #f59e0b;
            --accent-glow: rgba(245, 158, 11, 0.5);
            --text-color: #f8fafc;
            --neon-blue: #38bdf8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }

        .game-container {
            position: relative;
            width: 100%;
            max-width: 850px;
            height: 520px;
            background: linear-gradient(135deg, #1e1b4b 0%, #0f172a 100%);
            border-radius: 16px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5), 0 0 30px var(--accent-glow);
            overflow: hidden;
            border: 2px solid rgba(245, 158, 11, 0.3);
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        /* واجهة القوائم والتحكم */
        .overlay-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--panel-bg);
            backdrop-filter: blur(8px);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 10;
            transition: opacity 0.3s ease;
        }

        .hidden {
            opacity: 0;
            pointer-events: none;
        }

        h1 {
            font-size: 3rem;
            color: var(--accent-color);
            margin-bottom: 10px;
            text-shadow: 0 0 20px var(--accent-glow);
            letter-spacing: 2px;
        }

        p.subtitle {
            font-size: 1.1rem;
            color: #94a3b8;
            margin-bottom: 30px;
        }

        .btn {
            background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
            color: white;
            border: none;
            padding: 14px 36px;
            font-size: 1.2rem;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(245, 158, 11, 0.4);
            transition: all 0.2s ease;
            margin: 8px;
        }

        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 20px rgba(245, 158, 11, 0.6);
        }

        .btn:active {
            transform: translateY(1px);
        }

        /* شريط المعلومات العلوي داخل اللعبة */
        .hud {
            position: absolute;
            top: 15px;
            left: 20px;
            right: 20px;
            display: flex;
            justify-content: space-between;
            font-size: 1.1rem;
            font-weight: bold;
            z-index: 5;
            pointer-events: none;
            text-shadow: 0 2px 4px rgba(0,0,0,0.8);
        }

        .hud-item {
            background: rgba(15, 23, 42, 0.6);
            padding: 6px 16px;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
    </style>
</head>
<body>

    <div class="game-container">
        <!-- شريط المعلومات -->
        <div class="hud" id="hud" style="display: none;">
            <div class="hud-item">المرحلة: <span id="currentLevel">1</span></div>
            <div class="hud-item">النقاط: <span id="currentScore">0</span></div>
            <div class="hud-item">القلوب: <span id="currentLives">❤️❤️❤️</span></div>
        </div>

        <!-- لوحة البداية والقائمة الرئيسية -->
        <div id="startScreen" class="overlay-screen">
            <h1>رحلة النور</h1>
            <p class="subtitle">الإصدار العالمي المطور - تجربة تفاعلية فائقة</p>
            <button class="btn" onclick="game.start()">ابدأ الرحلة</button>
        </div>

        <!-- لوحة نهاية اللعبة / الفوز -->
        <div id="gameOverScreen" class="overlay-screen hidden">
            <h1 id="endTitle">انتهت الرحلة</h1>
            <p class="subtitle" id="endMessage">لقد جمعت رصيداً مميزاً من النور!</p>
            <button class="btn" onclick="game.restart()">العب مجدداً</button>
        </div>

        <!-- لوحة اللعب الفعلي (Canvas) -->
        <canvas id="gameCanvas" width="850" height="520"></canvas>
    </div>

    <script>
        /**
         * محرك لعبة "رحلة النور" - هندسة برمجة الكائنات الحديثة (OOP)
         */
        class GameEngine {
            constructor() {
                this.canvas = document.getElementById('gameCanvas');
                this.ctx = this.canvas.getContext('2d');
                
                this.score = 0;
                this.level = 1;
                this.lives = 3;
                this.isPlayActive = false;

                // إعدادات اللاعب (الجوهر المضيء)
                this.player = {
                    x: 100,
                    y: 260,
                    radius: 18,
                    speed: 6,
                    color: '#f59e0b',
                    targetY: 260
                };

                this.orbs = [];
                this.obstacles = [];
                this.keys = {};

                this.initListeners();
            }

            initListeners() {
                // التحكم بالماوس أو اللمس بسلاسة فائقة
                window.addEventListener('keydown', (e) => this.keys[e.key] = true);
                window.addEventListener('keyup', (e) => this.keys[e.key] = false);

                this.canvas.addEventListener('mousemove', (e) => {
                    if (!this.isPlayActive) return;
                    const rect = this.canvas.getBoundingClientRect();
                    this.player.targetY = e.clientY - rect.top;
                });

                this.canvas.addEventListener('touchmove', (e) => {
                    if (!this.isPlayActive) return;
                    const rect = this.canvas.getBoundingClientRect();
                    if (e.touches.length > 0) {
                        this.player.targetY = e.touches[0].clientY - rect.top;
                    }
                }, { passive: true });
            }

            start() {
                document.getElementById('startScreen').classList.add('hidden');
                document.getElementById('gameOverScreen').classList.add('hidden');
                document.getElementById('hud').style.display = 'flex';
                
                this.score = 0;
                this.level = 1;
                this.lives = 3;
                this.orbs = [];
                this.obstacles = [];
                this.isPlayActive = true;

                this.updateHUD();
                this.loop();
            }

            restart() {
                this.start();
            }

            spawnEntities() {
                // توليد عوالم وكرات نور ديناميكية
                if (Math.random() < 0.03 + (this.level * 0.005)) {
                    this.orbs.push({
                        x: this.canvas.width + 20,
                        y: Math.random() * (this.canvas.height - 60) + 30,
                        radius: 10,
                        speed: 3 + this.level
                    });
                }

                if (Math.random() < 0.02 + (this.level * 0.008)) {
                    this.obstacles.push({
                        x: this.canvas.width + 30,
                        y: Math.random() * (this.canvas.height - 80) + 40,
                        width: 25,
                        height: 25,
                        speed: 4 + this.level
                    });
                }
            }

            update() {
                if (!this.isPlayActive) return;

                // تتبع حركة اللاعب بسلاسة (Easing)
                this.player.y += (this.player.targetY - this.player.y) * 0.15;
                // تقييد الحركة داخل حدود الشاشة
                this.player.y = Math.max(this.player.radius, Math.min(this.canvas.height - this.player.radius, this.player.y));

                // دعم الأسهم لوحة المفاتيح أيضاً
                if (this.keys['ArrowUp'] || this.keys['w']) this.player.targetY -= this.player.speed;
                if (this.keys['ArrowDown'] || this.keys['s']) this.player.targetY += this.player.speed;

                this.spawnEntities();

                // تحديث كرات النور
                for (let i = this.orbs.length - 1; i >= 0; i--) {
                    let orb = this.orbs[i];
                    orb.x -= orb.speed;

                    // اصطدام اللاعب مع النور
                    let dist = Math.hypot(this.player.x - orb.x, this.player.y - orb.y);
                    if (dist < this.player.radius + orb.radius) {
                        this.score += 10;
                        this.orbs.splice(i, 1);
                        this.updateHUD();

                        // ترقية المستوى كل 100 نقطة
                        if (this.score % 100 === 0) {
                            this.level++;
                            this.updateHUD();
                        }
                    } else if (orb.x < -20) {
                        this.orbs.splice(i, 1);
                    }
                }

                // تحديث العوائق
                for (let i = this.obstacles.length - 1; i >= 0; i--) {
                    let obs = this.obstacles[i];
                    obs.x -= obs.speed;

                    // اصطدام اللاعب مع العوائق
                    if (
                        this.player.x + this.player.radius > obs.x &&
                        this.player.x - this.player.radius < obs.x + obs.width &&
                        this.player.y + this.player.radius > obs.y &&
                        this.player.y - this.player.radius < obs.y + obs.height
                    ) {
                        this.lives--;
                        this.obstacles.splice(i, 1);
                        this.updateHUD();

                        if (this.lives <= 0) {
                            this.endGame();
                        }
                    } else if (obs.x < -40) {
                        this.obstacles.splice(i, 1);
                    }
                }
            }

            render() {
                // مسح الشاشة بتأثير بصري ذو خلفية عميقة
                this.ctx.fillStyle = '#0f172a';
                this.ctx.fillRect(0, 0, this.canvas.width, this.canvas.height);

                // رسم شبكة خلفية جمالية خفيفة
                this.ctx.strokeStyle = 'rgba(255, 255, 255, 0.03)';
                this.ctx.lineWidth = 1;
                for (let x = 0; x < this.canvas.width; x += 40) {
                    this.ctx.beginPath();
                    this.ctx.moveTo(x, 0);
                    this.ctx.lineTo(x, this.canvas.height);
                    this.ctx.stroke();
                }

                // رسم كرات النور بمظهر مضيء (Glow)
                this.orbs.forEach(orb => {
                    this.ctx.save();
                    this.ctx.shadowBlur = 15;
                    this.ctx.shadowColor = '#38bdf8';
                    this.ctx.fillStyle = '#38bdf8';
                    this.ctx.beginPath();
                    this.ctx.arc(orb.x, orb.y, orb.radius, 0, Math.PI * 2);
                    this.ctx.fill();
                    this.ctx.restore();
                });

                // رسم العوائق الحادة
                this.obstacles.forEach(obs => {
                    this.ctx.save();
                    this.ctx.shadowBlur = 10;
                    this.ctx.shadowColor = '#ef4444';
                    this.ctx.fillStyle = '#ef4444';
                    this.ctx.fillRect(obs.x, obs.y, obs.width, obs.height);
                    this.ctx.restore();
                });

                // رسم اللاعب (الجوهر المضيء)
                this.ctx.save();
                this.ctx.shadowBlur = 25;
                this.ctx.shadowColor = this.player.color;
                this.ctx.fillStyle = this.player.color;
                this.ctx.beginPath();
                this.ctx.arc(this.player.x, this.player.y, this.player.radius, 0, Math.PI * 2);
                this.ctx.fill();
                this.ctx.restore();
            }

            loop() {
                if (!this.isPlayActive) return;
                this.update();
                this.render();
                requestAnimationFrame(() => this.loop());
            }

            updateHUD() {
                document.getElementById('currentLevel').innerText = this.level;
                document.getElementById('currentScore').innerText = this.score;
                let hearts = '';
                for (let i = 0; i < this.lives; i++) hearts += '❤️';
                document.getElementById('currentLives').innerText = hearts;
            }

            endGame() {
                this.isPlayActive = false;
                document.getElementById('hud').style.display = 'none';
                document.getElementById('endTitle').innerText = 'انتهت الرحلة';
                document.getElementById('endMessage').innerText = `حطمت رقماً رائعاً بمجموع نقاط: ${this.score} في المرحلة ${this.level}`;
                document.getElementById('gameOverScreen').classList.remove('hidden');

                // حفظ أعلى نتيجة محلياً (LocalStorage)
                const bestScore = localStorage.getItem('rihlat_alnoor_best') || 0;
                if (this.score > bestScore) {
                    localStorage.setItem('rihlat_alnoor_best', this.score);
                }
            }
        }

        // تشغيل المحرك عند تحميل الصفحة
        const game = new GameEngine();
    </script>
</body>
</html>
