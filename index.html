<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>راية الحق - النسخة النهائية الماسية</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --ui-alpha: 0.6;
            --ui-scale: 1;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Amiri', 'Traditional Arabic', 'Noto Naskh Arabic', serif;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
            -webkit-touch-callout: none;
        }

        body, html {
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            background-color: #0c0e14;
            color: #f0f0f5;
            overflow: hidden;
            position: fixed;
        }

        #game-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        /* شاشة التحذير للوضع العمودي (فقط للأجهزة اللمسية) */
        #orientation-warning {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100dvh;
            background: #050508;
            color: #d4af37;
            z-index: 999;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
        }

        @media (orientation: portrait) and (pointer: coarse) {
            #orientation-warning {
                display: flex;
            }
        }

        /* الواجهة العلوية مع تصحيح Safe Area (اليمين واليسار بدقة) */
        .hud-header {
            position: absolute;
            top: 0;
            left: 0;
            width: calc(100% / var(--ui-scale));
            padding: 15px max(25px, env(safe-area-inset-left)) 15px max(25px, env(safe-area-inset-right));
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: linear-gradient(to bottom, rgba(5,5,8,0.85), rgba(5,5,8,0));
            z-index: 10;
            pointer-events: none;
            transform: scale(var(--ui-scale));
            transform-origin: top left;
        }

        .title-badge h1 {
            font-size: 1.4rem;
            color: #d4af37;
            text-shadow: 0 2px 6px rgba(0,0,0,0.9);
        }

        .stats-container {
            display: flex;
            gap: 10px;
            pointer-events: auto;
        }

        .stat-box {
            background: rgba(12, 12, 18, var(--ui-alpha));
            border: 1px solid rgba(212, 175, 55, 0.4);
            padding: 5px 12px;
            border-radius: 6px;
            font-size: 0.9rem;
            backdrop-filter: blur(6px);
        }

        .stat-box span {
            color: #d4af37;
            font-weight: bold;
        }

        /* البوصلة بترتيب مألوف N-E-S-W وتوافق Safe Area */
        .compass {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%) scale(var(--ui-scale));
            transform-origin: top center;
            width: 180px;
            height: 36px;
            background: rgba(12, 12, 18, var(--ui-alpha));
            border: 1px solid rgba(212, 175, 55, 0.3);
            border-radius: 18px;
            display: flex;
            direction: ltr;
            justify-content: space-around;
            align-items: center;
            font-size: 0.85rem;
            color: #888;
            z-index: 10;
            backdrop-filter: blur(4px);
            pointer-events: none;
        }

        .compass .active-dir {
            color: #d4af37;
            font-weight: bold;
            font-size: 1rem;
            text-shadow: 0 0 8px #d4af37;
        }

        /* زر الإعدادات مع Safe Area */
        .settings-btn {
            position: absolute;
            top: 15px;
            right: max(20px, env(safe-area-inset-right));
            background: rgba(12, 12, 18, var(--ui-alpha));
            border: 1px solid rgba(212, 175, 55, 0.5);
            color: #d4af37;
            padding: 6px 14px;
            border-radius: 6px;
            cursor: pointer;
            z-index: 15;
            backdrop-filter: blur(4px);
            transform: scale(var(--ui-scale));
            transform-origin: top right;
            touch-action: manipulation;
        }

        .settings-btn:active {
            background: rgba(139, 0, 0, 0.8);
            color: #fff;
        }

        /* أزرار اللمس D-Pad المحسنة */
        #dpad {
            position: absolute;
            bottom: max(25px, env(safe-area-inset-bottom));
            right: max(25px, env(safe-area-inset-right));
            z-index: 15;
            display: grid;
            grid-template-columns: repeat(3, 50px);
            grid-template-rows: repeat(3, 50px);
            gap: 6px;
            touch-action: none;
            transform: scale(var(--ui-scale));
            transform-origin: bottom right;
        }

        #dpad button {
            background: rgba(12, 12, 18, var(--ui-alpha));
            border: 1px solid rgba(212, 175, 55, 0.4);
            color: #d4af37;
            font-size: 1.2rem;
            border-radius: 8px;
            backdrop-filter: blur(4px);
            outline: none;
            touch-action: none;
        }

        #dpad button:active {
            background: rgba(139, 0, 0, 0.8);
            color: #fff;
        }

        .controls-hint {
            position: absolute;
            bottom: max(25px, env(safe-area-inset-bottom));
            left: max(25px, env(safe-area-inset-left));
            background: rgba(12, 12, 18, 0.6);
            border: 1px solid rgba(212, 175, 55, 0.3);
            padding: 8px 14px;
            border-radius: 8px;
            font-size: 0.8rem;
            color: #aaa;
            backdrop-filter: blur(4px);
            z-index: 10;
            pointer-events: none;
        }

        /* نافذة الإعدادات */
        #settings-modal {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: min(380px, 90vw);
            max-height: 90vh;
            overflow-y: auto;
            background: rgba(12, 12, 18, 0.95);
            border: 2px solid #d4af37;
            border-radius: 12px;
            padding: 20px;
            display: none;
            z-index: 30;
            backdrop-filter: blur(10px);
            box-shadow: 0 20px 40px rgba(0,0,0,0.9);
        }

        #settings-modal h3 {
            color: #d4af37;
            margin-bottom: 15px;
            border-bottom: 1px solid #333;
            padding-bottom: 5px;
        }

        .setting-group {
            margin-bottom: 12px;
            font-size: 0.9rem;
        }

        .setting-group label {
            display: block;
            margin-bottom: 5px;
            color: #ccc;
        }

        .setting-group input[type="range"] {
            width: 100%;
            accent-color: #8b0000;
        }

        .close-modal-btn {
            background: #8b0000;
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 4px;
            cursor: pointer;
            width: 100%;
            margin-top: 10px;
        }

        /* نافذة القصة */
        #story-modal {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            width: min(90vw, 650px);
            max-height: 45vh;
            overflow-y: auto;
            background: rgba(12, 12, 18, 0.95);
            border: 2px solid #d4af37;
            border-radius: 10px;
            padding: 20px;
            display: none;
            z-index: 25;
            box-shadow: 0 15px 35px rgba(0,0,0,0.9);
            backdrop-filter: blur(8px);
        }

        #story-title {
            color: #d4af37;
            font-size: 1.2rem;
            margin-bottom: 8px;
            border-bottom: 1px solid #333;
            padding-bottom: 4px;
        }

        #story-text {
            font-size: 1rem;
            line-height: 1.5;
            margin-bottom: 15px;
            color: #ddd;
        }

        .action-btn {
            background: rgba(139, 0, 0, 0.85);
            color: white;
            border: 1px solid #ff4d4d;
            padding: 7px 18px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.9rem;
        }

        @media (max-width: 850px) {
            .compass { top: 62px; width: 140px; font-size: 0.75rem; }
            .stat-box { padding: 4px 8px; font-size: 0.75rem; }
            .title-badge h1 { font-size: 1rem; }
            .controls-hint { display: none; }
        }
    </style>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js" onerror="document.body.innerHTML='<div style=\'color:#d4af37;text-align:center;padding:50px;\'>تعذر تحميل مكتبة الرسوميات، تحقق من اتصالك بالإنترنت.</div>'"></script>
</head>
<body>

    <div id="orientation-warning">
        <h2>الرجاء تدوير الجهاز</h2>
        <p>لعبة راية الحق مصممة للعمل في الوضع العرضي (Landscape).</p>
    </div>

    <header class="hud-header">
        <div class="title-badge">
            <h1>رَايَةُ الحَقّ</h1>
        </div>
        <div class="stats-container">
            <div class="stat-box">الماء: <span id="val-water">100</span></div>
            <div class="stat-box">الزاد: <span id="val-food">80</span></div>
            <div class="stat-box">اليقين: <span id="val-morale">90</span></div>
        </div>
    </header>

    <button class="settings-btn" onclick="toggleSettings(true)">⚙️ الإعدادات</button>

    <!-- البوصلة بترتيب N-E-S-W -->
    <div class="compass">
        <span id="dir-n" class="active-dir">N</span>
        <span id="dir-e">E</span>
        <span id="dir-s">S</span>
        <span id="dir-w">W</span>
    </div>

    <div class="controls-hint">
        التجوال: أزرار الأسهم أو (W, A, S, D)
    </div>

    <div id="dpad">
        <span></span><button data-k="KeyW">▲</button><span></span>
        <button data-k="KeyA">◀</button><span></span><button data-k="KeyD">▶</button>
        <span></span><button data-k="KeyS">▼</button><span></span>
    </div>

    <div id="settings-modal">
        <h3>إعدادات العرض والواجهة</h3>
        <div class="setting-group">
            <label>حجم ومقاس الرموز: <span id="scale-val">100</span>%</label>
            <input type="range" id="ui-scale-slider" min="70" max="130" value="100" oninput="changeUIScale(this.value)">
        </div>
        <div class="setting-group">
            <label>شفافية الواجهة: <span id="trans-val">60</span>%</label>
            <input type="range" id="ui-trans-slider" min="20" max="90" value="60" oninput="changeUITransparency(this.value)">
        </div>
        <button class="close-modal-btn" onclick="toggleSettings(false)">حفظ وإغلاق</button>
    </div>

    <canvas id="game-canvas"></canvas>

    <div id="story-modal">
        <h2 id="story-title">عنوان المدينة</h2>
        <p id="story-text">محتوى القصة...</p>
        <button id="story-action-btn" class="action-btn" onclick="onStoryAction()">متابعة المسير</button>
    </div>

<script>
    // استرجاع الإعدادات المحفوظة مسبقاً إن وجدت
    try {
        const savedScale = localStorage.getItem('raya_ui_scale');
        const savedAlpha = localStorage.getItem('raya_ui_alpha');
        if (savedScale) {
            document.documentElement.style.setProperty('--ui-scale', savedScale);
            document.getElementById('ui-scale-slider').value = Math.round(savedScale * 100);
            document.getElementById('scale-val').innerText = Math.round(savedScale * 100);
        }
        if (savedAlpha) {
            document.documentElement.style.setProperty('--ui-alpha', savedAlpha);
            document.getElementById('ui-trans-slider').value = Math.round(savedAlpha * 100);
            document.getElementById('trans-val').innerText = Math.round(savedAlpha * 100);
        }
    } catch (e) {}

    const keys = {};
    window.addEventListener('keydown', e => { if (!isPaused()) keys[e.code] = true; });
    window.addEventListener('keyup', e => { keys[e.code] = false; });
    window.addEventListener('blur', () => { clearKeys(); });

    function clearKeys() {
        for (const k in keys) keys[k] = false;
    }

    document.querySelectorAll('#dpad button').forEach(b => {
        const k = b.dataset.k;
        b.addEventListener('pointerdown', e => {
            e.preventDefault();
            b.setPointerCapture(e.pointerId);
            keys[k] = true;
        });
        ['pointerup','pointercancel'].forEach(ev =>
            b.addEventListener(ev, () => {
                try { b.releasePointerCapture(e.pointerId); } catch(err){}
                keys[k] = false;
            }));
    });

    const ui = { story: false, settings: false, gameOver: false };
    const isPaused = () => ui.story || ui.settings || ui.gameOver;

    let renderer, scene, camera, sunLight;
    let playerGroup;
    let cityMeshes = [];
    let currentCity = null;

    const playerPos = { x: 0, z: 50, speed: 0.35 };
    let gameState = { water: 100, food: 80, morale: 90, visitedCount: 0 };
    let lastRenderedStats = { water: -1, food: -1, morale: -1 };

    let lastTime = performance.now();

    try {
        if (typeof THREE === 'undefined') throw new Error("Three.js not loaded");

        const canvas = document.getElementById('game-canvas');
        scene = new THREE.Scene();
        scene.background = new THREE.Color(0x3a3024);
        scene.fog = new THREE.FogExp2(0x3a3024, 0.009);

        camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true, powerPreference: "high-performance" });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.outputEncoding = THREE.sRGBEncoding;
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;

        initGameWorld();
        
        // ضبط الكاميرا فوراً لمنع أي قفزة بداية
        camera.position.set(playerPos.x, 30, playerPos.z + 40);
        camera.lookAt(playerPos.x, 0, playerPos.z - 5);

        requestAnimationFrame(gameLoop);
    } catch (e) {
        console.error("Game Init Error:", e);
        document.body.innerHTML = '<div style="display:flex;justify-content:center;align-items:center;height:100vh;background:#050508;color:#d4af37;font-family:Amiri,serif;font-size:1.4rem;text-align:center;padding:20px;">تعذر تشغيل اللعبة، تأكد من دعم متصفحك لـ WebGL واتصالك بالإنترنت.</div>';
    }

    function initGameWorld() {
        const ambientLight = new THREE.AmbientLight(0xfff5e6, 0.8);
        scene.add(ambientLight);

        sunLight = new THREE.DirectionalLight(0xffeedd, 1.4);
        sunLight.position.set(60, 90, 60);
        sunLight.castShadow = true;
        sunLight.shadow.mapSize.set(1024, 1024); // موازن للأداء على الجوال
        const sc = sunLight.shadow.camera;
        sc.left = -90; sc.right = 90; sc.top = 90; sc.bottom = -90; sc.near = 1; sc.far = 250;
        scene.add(sunLight);
        scene.add(sunLight.target);

        // أرضية خفيفة بلا تقسيمات مفرطة
        const peninsulaGeo = new THREE.PlaneGeometry(280, 280, 1, 1);
        const peninsulaMat = new THREE.MeshStandardMaterial({ color: 0x2a2218, roughness: 0.95 });
        const peninsula = new THREE.Mesh(peninsulaGeo, peninsulaMat);
        peninsula.rotation.x = -Math.PI / 2;
        peninsula.receiveShadow = true;
        scene.add(peninsula);

        const citiesData = [
            { id: 'karbala', name: 'كربلاء (المهد)', x: -30, z: -20, color: 0x8b0000, desc: 'مهد الصمود والعهد الأول تحت الحصار.' },
            { id: 'najaf', name: 'النجف (باب الحكمة)', x: 10, z: -40, color: 0xb8860b, desc: 'مدينة الحصون والفرسان ومفاوضات قبائل البادية.' },
            { id: 'graim', name: 'المدينة العظمى', x: 40, z: 10, color: 0x4b0082, desc: 'محطة الحسم الكبرى وتوحيد الرايات تحت قيادة القائد العباس.' }
        ];

        citiesData.forEach(cData => {
            const group = new THREE.Group();
            const baseGeo = new THREE.CylinderGeometry(7, 9, 2, 16);
            const baseMat = new THREE.MeshStandardMaterial({ color: cData.color, roughness: 0.5 });
            const base = new THREE.Mesh(baseGeo, baseMat);
            base.position.y = 1;
            base.castShadow = true;
            base.receiveShadow = true;
            group.add(base);

            const towerGeo = new THREE.BoxGeometry(2.5, 8, 2.5);
            const towerMat = new THREE.MeshStandardMaterial({ color: 0x2a2a32 });
            const tower = new THREE.Mesh(towerGeo, towerMat);
            tower.position.y = 5;
            tower.castShadow = true;
            group.add(tower);

            group.position.set(cData.x, 0, cData.z);
            scene.add(group);
            cityMeshes.push({ ...cData, visited: false, mesh: group });
        });

        // شخصية البطل العباس مع مؤشر اتجاه أمامي بَصري
        playerGroup = new THREE.Group();
        const bodyGeo = new THREE.ConeGeometry(1.8, 5, 8);
        const bodyMat = new THREE.MeshStandardMaterial({ color: 0xd4af37, roughness: 0.3, metalness: 0.8 });
        const playerMesh = new THREE.Mesh(bodyGeo, bodyMat);
        playerMesh.position.y = 2.5;
        playerMesh.castShadow = true;
        playerGroup.add(playerMesh);

        // مؤشر الاتجاه الأمامي
        const pointerGeo = new THREE.BoxGeometry(0.4, 0.4, 1.2);
        const pointerMat = new THREE.MeshStandardMaterial({ color: 0xff4d4d });
        const pointerMesh = new THREE.Mesh(pointerGeo, pointerMat);
        pointerMesh.position.set(0, 3.5, -1);
        playerGroup.add(pointerMesh);

        scene.add(playerGroup);
    }

    function gameLoop(now) {
        requestAnimationFrame(gameLoop);
        
        try {
            const dt = Math.min(now - lastTime, 50) / 16.67;
            lastTime = now;

            if (!isPaused()) {
                let dx = 0, dz = 0;
                if (keys.ArrowUp    || keys.KeyW) dz -= 1;
                if (keys.ArrowDown  || keys.KeyS) dz += 1;
                if (keys.ArrowLeft  || keys.KeyA) dx -= 1;
                if (keys.ArrowRight || keys.KeyD) dx += 1;

                const len = Math.hypot(dx, dz);
                if (len > 0) {
                    dx /= len; dz /= len;
                    playerPos.x += dx * playerPos.speed * dt;
                    playerPos.z += dz * playerPos.speed * dt;
                    updateCompass(dx, dz);
                    playerGroup.rotation.y = Math.atan2(dx, dz);
                }

                // استهلاك المؤن (موازن بدقة للتحدي)
                gameState.water = Math.max(0, gameState.water - 0.008 * dt);
                gameState.food = Math.max(0, gameState.food - 0.005 * dt);

                if (gameState.water <= 0 || gameState.food <= 0) {
                    gameState.morale = Math.max(0, gameState.morale - 0.03 * dt);
                    if (gameState.morale <= 0) {
                        triggerGameOver("نفدت المؤن والمياه وانكسر اليقين... انتهت الرحلة.", false);
                    }
                }

                // تحديث الـ DOM بكفاءة (فقط عند تغير القيمة المقررة لمنع إثقال الجوال)
                const rWater = Math.round(gameState.water);
                const rFood = Math.round(gameState.food);
                const rMorale = Math.round(gameState.morale);

                if (rWater !== lastRenderedStats.water) { document.getElementById('val-water').innerText = rWater; lastRenderedStats.water = rWater; }
                if (rFood !== lastRenderedStats.food) { document.getElementById('val-food').innerText = rFood; lastRenderedStats.food = rFood; }
                if (rMorale !== lastRenderedStats.morale) { document.getElementById('val-morale').innerText = rMorale; lastRenderedStats.morale = rMorale; }

                playerPos.x = Math.max(-100, Math.min(100, playerPos.x));
                playerPos.z = Math.max(-100, Math.min(100, playerPos.z));
                playerGroup.position.set(playerPos.x, 0, playerPos.z);

                // تحريك مصدر الضوء والظلال ليتبع اللاعب بدقة
                sunLight.position.set(playerPos.x + 60, 90, playerPos.z + 60);
                sunLight.target.position.set(playerPos.x, 0, playerPos.z);
                sunLight.target.updateMatrixWorld();

                camera.position.x += (playerPos.x - camera.position.x) * 0.1;
                camera.position.y = 30;
                camera.position.z += ((playerPos.z + 40) - camera.position.z) * 0.1;
                camera.lookAt(playerPos.x, 0, playerPos.z - 5);

                for (const city of cityMeshes) {
                    let dist = Math.hypot(playerPos.x - city.x, playerPos.z - city.z);
                    if (dist < 9 && !city.visited) {
                        triggerCityStory(city);
                        break;
                    }
                }
            }
            renderer.render(scene, camera);
        } catch (err) {
            console.error("Runtime error in gameLoop:", err);
        }
    }

    function updateCompass(dx, dz) {
        // ترتيب دقيق متوافق مع N-E-S-W
        const dominant = Math.abs(dz) >= Math.abs(dx);
        let dir = dominant ? (dz < 0 ? 'n' : 's') : (dx > 0 ? 'e' : 'w');
        ['n','e','s','w'].forEach(d =>
            document.getElementById('dir-' + d).classList.toggle('active-dir', d === dir));
    }

    function triggerCityStory(city) {
        ui.story = true;
        clearKeys();
        currentCity = city;
        city.visited.visited = true; // علامة بصرية للمدن المزارة
        // تغيير لون قاعدة المدينة لتدل على زيارتها
        city.mesh.children[0].material.color.setHex(0x444444);

        gameState.visitedCount++;
        gameState.morale = Math.min(100, gameState.morale + 15);
        gameState.water = Math.min(100, gameState.water + 35);
        gameState.food = Math.min(100, gameState.food + 30);

        document.getElementById('story-title').innerText = "دخول: " + city.name;
        document.getElementById('story-text').innerText = city.desc + "\n\n• تم التزود بالمؤن وتوحيد الصفوف بنجاح.";
        
        if (gameState.visitedCount >= cityMeshes.length) {
            document.getElementById('story-action-btn').innerText = "إعلان النصر الأبدي";
        } else {
            document.getElementById('story-action-btn').innerText = "متابعة المسير";
        }
        document.getElementById('story-modal').style.display = 'block';
    }

    function onStoryAction() {
        if (ui.gameOver) {
            location.reload();
        } else {
            closeStoryModal();
        }
    }

    function closeStoryModal() {
        document.getElementById('story-modal').style.display = 'none';
        ui.story = false;

        if (gameState.visitedCount >= cityMeshes.length) {
            triggerGameOver("انتصر الحق وارتفعت الرايات! تكللت رحلة القائد العباس بالظفر المبين.", true);
            return;
        }

        if (currentCity) {
            const angle = Math.atan2(playerPos.z - currentCity.z, playerPos.x - currentCity.x);
            playerPos.x = currentCity.x + Math.cos(angle) * 13;
            playerPos.z = currentCity.z + Math.sin(angle) * 13;
        }
    }

    function triggerGameOver(msg, win = false) {
        if (ui.gameOver) return;
        ui.gameOver = true;
        ui.story = false;
        clearKeys();

        document.getElementById('story-title').innerText = win ? "انتصار مبين" : "نهاية الملحمة";
        document.getElementById('story-text').innerText = msg;
        document.getElementById('story-action-btn').innerText = "إعادة الرحلة";
        document.getElementById('story-modal').style.display = 'block';
    }

    function toggleSettings(open) {
        document.getElementById('settings-modal').style.display = open ? 'block' : 'none';
        ui.settings = open;
        if (open) clearKeys();
    }

    function changeUIScale(v) {
        document.getElementById('scale-val').innerText = v;
        document.documentElement.style.setProperty('--ui-scale', v / 100);
        try { localStorage.setItem('raya_ui_scale', v / 100); } catch(e){}
    }

    function changeUITransparency(v) {
        document.getElementById('trans-val').innerText = v;
        document.documentElement.style.setProperty('--ui-alpha', v / 100);
        try { localStorage.setItem('raya_ui_alpha', v / 100); } catch(e){}
    }

    window.addEventListener('resize', () => {
        if (!camera || !renderer) return;
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    });
</script>
</body>
</html>
